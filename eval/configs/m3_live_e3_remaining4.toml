# Predeclared development engineering experiment; no independent/final qualification.
[run]
name = "m3_live_e3_remaining4"
purpose = "M3/M4 synthetic development study; no human learning or independent evaluation claim"
arm = "c2"
contextual = true
defences = true
llm = "auto"
voice = "template"
seeds = [1, 2, 3]
max_turns = 8
turn_timeout_s = 120
playbook = "eval/fixtures/m3_candidate_playbook.json"

[data]
only_students = ["sim_v2_002__arithmetic_progressions", "sim_v2_006__trigonometry", "sim_v2_007__quadratic_equations", "sim_v2_013__quadratic_equations"]
students = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_data/development-v1/students.json"
quiz_pairs = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_data/development-v1/pairs.json"
assignments = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_data/development-v1/assignments.json"

[gate]
max_failures = 0
min_sessions = 12

[provider_budget]
path = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_runs/provider_budget_extension_e3.json"
approval_receipt = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_runs/v2/live/E3_EXTENSION_APPROVAL.json"
max_calls = 50
max_usd = 0.03
prior_calls = 1000

[cost]
"openai/gpt-4.1-mini" = [0.40, 1.60]
