# Predeclared development engineering experiment; no independent/final qualification.
[run]
post_copy_policy = "context_bound_post_copy_v1_candidate"
name = "pq_v1_offline_c2"
purpose = "M3/M4 synthetic development study; no human learning or independent evaluation claim"
arm = "c2"
contextual = true
defences = true
llm = "stub"
voice = "template"
seeds = [1, 2, 3]
max_turns = 8
turn_timeout_s = 120

[data]
students = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_data/development-v1/students.json"
quiz_pairs = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_data/development-v1/pairs.json"
assignments = "$SOCRATES_SOURCE_WORKSPACE/Directions/m3_data/development-v1/assignments.json"

[gate]
max_failures = 0
min_sessions = 48

[cost]
"openai/gpt-4.1-mini" = [0.40, 1.60]
