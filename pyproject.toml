[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-tutor"
version = "0.1.0.dev0"
description = "Socratic Tutor proof of concept: one chapter, two misconceptions, every architecture box"
requires-python = ">=3.12"
# Pinned to the versions the POC was tested with (see Docs/plan/02-starting-point.md).
dependencies = [
    "langgraph==1.2.17",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-openai==1.7.2",
    "fastmcp==4.1.3",
    "bm25s==0.3.15",
    "sympy==1.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
# Hybrid retrieval: dense vectors on CPU (ONNX). Without it, hybrid mode runs on BM25 alone.
# Ingestion also needs poppler's `pdftotext` on PATH (Docs/spikes/S3.md).
retrieval = ["fastembed==0.9.1"]
# Spike S3 only: the pure-Python extractor compared with pdftotext.
spike = ["pypdf==6.21.4"]

[project.scripts]
tutor = "tutor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
