name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,api]"
      - run: pytest -q
        env:
          TUTOR_LLM: stub
      # Evaluation gate (R5): the pipeline runs end to end on development data, offline.
      - name: Eval gate - simulated students
        run: python -m tutor_eval.harness --config eval/configs/dev_smoke.toml
        env:
          TUTOR_LLM: stub
      - name: Eval gate - security cases
        run: python -m tutor_eval.security --cases eval/fixtures/security_smoke.jsonl --name ci_security --gate
        env:
          TUTOR_LLM: stub
