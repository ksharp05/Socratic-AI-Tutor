name: CI

on:
  pull_request:
  push:
    branches: [main, milestone-2, Beta]
    paths-ignore: ["Docs/**", "PROJECT_CONTEXT.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socrates_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d socrates_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-beta.txt
      - run: pip install -e ".[dev,api,ui]" -r requirements-beta.txt
      # External corpus artifacts stay local; portable tests and synthetic imports remain mandatory.
      - run: pytest -q --strict-markers -m "not local_corpus" tests tests_beta tests_book_pipeline tests_integration_v02
        env:
          TUTOR_LLM: stub
          BETA_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/socrates_test
      - name: Portable index registration (synthetic data)
        run: pytest -q tests_beta/test_portable_registry.py
        env:
          TUTOR_LLM: stub
      # Development-only evaluation smoke runs; no held-out data or model keys.
      - name: C1 single-controller smoke
        run: python -m tutor_eval.harness --config eval/configs/m2_development_c1.toml
        env:
          TUTOR_LLM: stub
      - name: Eval gate - simulated students
        run: python -m tutor_eval.harness --config eval/configs/dev_smoke.toml
        env:
          TUTOR_LLM: stub
      - name: Eval gate - security cases
        run: python -m tutor_eval.security --cases eval/fixtures/security_smoke.jsonl --name ci_security --gate
        env:
          TUTOR_LLM: stub
